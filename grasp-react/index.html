<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / browser tab + Google Search icon: square Grasp logo -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>Grasp Electric | Industrial Enclosure Systems</title>
    <meta
      name="description"
      content="Grasp Electric manufactures high-quality industrial enclosure systems — IP-rated polycarbonate and metal enclosures, junction boxes and modular panels for demanding environments."
    />
    <link rel="canonical" href="https://www.graspelectric.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grasp Electric" />
    <meta property="og:title" content="Grasp Electric | Industrial Enclosure Systems" />
    <meta
      property="og:description"
      content="High-quality industrial enclosure systems — IP-rated enclosures, junction boxes and modular panels for demanding environments."
    />
    <meta property="og:url" content="https://www.graspelectric.com/" />
    <meta property="og:image" content="https://www.graspelectric.com/logo.png" />
    <meta property="og:image:alt" content="Grasp Electric logo" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Grasp Electric | Industrial Enclosure Systems" />
    <meta
      name="twitter:description"
      content="High-quality industrial enclosure systems — IP-rated enclosures, junction boxes and modular panels for demanding environments."
    />
    <meta name="twitter:image" content="https://www.graspelectric.com/logo.png" />

    <!-- Organization structured data: tells Google which logo to show in Search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Grasp Electric",
        "url": "https://www.graspelectric.com/",
        "logo": "https://www.graspelectric.com/logo.png"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
